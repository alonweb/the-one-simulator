<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE ONE — session</title>
<style>
  /* without this, a 100%-wide button plus its padding is wider than the phone */
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; max-width: 520px; line-height: 1.5; }
  button { font-size: 18px; padding: 12px 16px; margin: 4px 0; width: 100%; }
  button[aria-pressed="true"] { outline: 3px solid #333; font-weight: 700; }
  .pair { display: flex; gap: 12px; }
  /* min-width:0 is what lets a flex item shrink below its image's natural width;
     without it the row overflows and the two contestants stack off-screen */
  .pair > div { flex: 1; min-width: 0; }
  /* one shape for every portrait, so the two captions sit on the same line */
  img { width: 100%; aspect-ratio: 4 / 5; height: auto; object-fit: cover; background: #eee; display: block; border-radius: 4px; }
  .pair p { margin: 6px 0 0; font-weight: 600; }
  .qa { border-top: 1px solid #ddd; margin-top: 4px; padding-top: 4px; }
  .sum { background: #f6f6f6; padding: 12px; border-radius: 6px; }
  .sum li { margin: 2px 0; }
  input[type=range] { width: 100%; }
  .err { color: #a00; }
</style>
</head>
<body>
  <main id="screen">Loading…</main>
  <script type="module" src="app.js"></script>
</body>
</html>
