<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE ONE — presenter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body { max-width: 900px; padding-bottom: 40px; }
  .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 14px 0; }
  .bar button { width: auto; min-width: 170px; margin-top: 0; }
  .bar input { width: 220px; }
  table { border-collapse: collapse; width: 100%; margin: 10px 0;
          border: 2px solid var(--ink); border-radius: 18px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--grey); }
  th { background: var(--yellow); font-weight: 800; }
  tr:last-child td { border-bottom: 0; }
  .warn { font-weight: 800; background: var(--yellow); padding: 10px 16px; border-radius: 14px; }
  .player { border: 2px solid var(--ink); border-radius: 22px; padding: 12px 18px; margin: 14px 0; }
  .player h3 { margin: 0 0 6px; display: flex; justify-content: space-between; }
  .player table { margin: 6px 0 10px; font-size: 14px; }
  .player h4 { margin: 10px 0 2px; font-size: 15px; }
  .pts { font-weight: 800; text-align: right; }
  details summary { cursor: pointer; font-weight: 800; margin: 12px 0; }
  td a { color: var(--ink); font-weight: 700; text-decoration: underline; }
  .player { scroll-margin-top: 12px; }
  /* never cropped: the width is fixed and the height follows the photo's own shape */
  img.thumb { width: 48px; height: auto; border-radius: 8px; vertical-align: middle;
    margin-right: 8px; border: 2px solid var(--ink); }
  .player h4 img.thumb, details h3 img.thumb { width: 38px; }
  table.contest td.won { background: var(--yellow-pale); font-weight: 700; }
  table.contest th, table.contest td { padding: 8px 10px; white-space: nowrap; }
  .player h3 .up { font-size: 13px; font-weight: 600; margin-left: 10px; color: var(--muted); }

  /* competitions: one row per matchup with its release switch */
  .comps { display: flex; flex-direction: column; gap: 8px; margin: 10px 0 6px; }
  .comp { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
          border: 2px solid var(--ink); border-radius: 18px; padding: 8px 12px; }
  .comp.on { background: var(--yellow-pale); }
  .comp .num { font-weight: 900; font-size: 20px; min-width: 22px; }
  .comp .who { font-weight: 700; }
  .comp .who img.thumb { width: 34px; }
  .comp .count { margin-left: auto; color: var(--muted); font-weight: 700; }
  .comp .flag { font-weight: 900; background: var(--ink); color: var(--yellow);
                border-radius: var(--r-pill); padding: 8px 18px; }
  .comp button.release { width: auto; min-width: 130px; margin-top: 0; min-height: 44px; }

  /* the board alone, for the room's screen */
  #projector { position: fixed; inset: 0; z-index: 60; background: var(--ink); color: var(--white);
               overflow-y: auto; padding: 3vh 4vw; }
  #projector[hidden] { display: none; }
  .proj-head { display: flex; align-items: center; gap: 24px; margin-bottom: 2vh; }
  .proj-head .logo { color: var(--yellow); font-size: clamp(28px, 4vw, 56px); }
  .proj-head .logo .badge { color: var(--ink); }
  .proj-head p { font-size: clamp(18px, 2.2vw, 32px); font-weight: 800; margin: 0; }
  .proj-head button { width: auto; margin: 0 0 0 auto; min-height: 40px; padding: 0 20px; }
  .proj-board { list-style: none; padding: 0; margin: 0; }
  .proj-board.two { column-count: 2; column-gap: 4vw; }
  .proj-board li { display: flex; align-items: center; gap: 2vw; break-inside: avoid;
                   font-size: clamp(22px, 2.8vw, 44px); font-weight: 800;
                   padding: .35em .6em; margin: 0 0 .3em; border-radius: 18px; background: #1a1a1a; }
  .proj-board li:first-child { background: var(--yellow); color: var(--ink); }
  .proj-board .rank { min-width: 1.6em; color: var(--yellow); }
  .proj-board li:first-child .rank { color: var(--ink); }
  .proj-board .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj-board .total { margin-left: auto; }
  .proj-empty { font-size: clamp(22px, 3vw, 44px); font-weight: 800; }
</style>
</head>
<body>
  <header class="top" id="top"><h1 class="logo">THE ONE <span class="badge">1</span></h1></header>
  <p class="eyebrow">Presenter</p>
  <div id="login">
    <p>Enter the presenter key to see the statistics.</p>
    <form class="bar" id="loginForm">
      <input id="key" type="password" placeholder="Presenter key" autocomplete="current-password" autofocus>
      <button id="load" class="cta" style="margin-top:0" type="submit">Enter</button>
    </form>
    <p class="note">The key stays on this device. Never give it to participants.</p>
    <div id="loginErr"></div>
  </div>
  <div id="stats" hidden>
    <div class="bar">
      <button id="project" class="cta">Project the board</button>
      <button id="close" class="ghost">Close the round</button>
      <button id="export" class="ghost">Export raw answers</button>
      <button id="reset" class="ghost">Reset the sheet</button>
      <button id="logout" class="ghost">Log out</button>
    </div>
    <div id="out"></div>
  </div>
  <div id="projector" hidden></div>
  <script type="module" src="presenter.js"></script>
</body>
</html>
