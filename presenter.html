<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE ONE — presenter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body { max-width: 900px; padding-bottom: 40px; }
  .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 14px 0; }
  .bar button { width: auto; min-width: 170px; margin-top: 0; }
  .bar input { width: 220px; }
  table { border-collapse: collapse; width: 100%; margin: 10px 0;
          border: 2px solid var(--ink); border-radius: 18px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--grey); }
  th { background: var(--yellow); font-weight: 800; }
  tr:last-child td { border-bottom: 0; }
  .warn { font-weight: 800; background: var(--yellow); padding: 10px 16px; border-radius: 14px; }
</style>
</head>
<body>
  <header class="top"><h1 class="logo">THE ONE <span class="badge">1</span></h1></header>
  <p class="eyebrow">Presenter</p>
  <div class="bar">
    <input id="code" placeholder="Session code">
    <input id="key" type="password" placeholder="Presenter key" autocomplete="off">
    <button id="load" class="ghost">Load</button>
  </div>
  <p class="note">The key is only needed to close the round or reveal the results, and it
    stays on this device. Never give it to participants.</p>
  <div class="bar">
    <button id="close" class="ghost">Close the round</button>
    <button id="reveal" class="cta" style="margin-top:0">Reveal results</button>
    <button id="export" class="ghost">Export raw answers</button>
  </div>
  <div id="out"><p class="note">Enter the session code and press Load.</p></div>
  <script type="module" src="presenter.js"></script>
</body>
</html>
